# Запускается только при мердже PR в release, если заголовок PR начинается с update_release_ (например update_release_1.0).
# Определяет версию по conventional commits, поднимает её по semver,
# обновляет package.json, CHANGELOG.md, создаёт тег и записывает версию в VERSION и .env.

name: Release

on:
  pull_request:
    branches:
      - release
    types:
      - closed

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Только если PR смержен и заголовок PR начинается с update_release_
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'update_release_')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx release-it --ci

      - name: Create .env with APP_VERSION
        run: |
          echo "APP_VERSION=$(cat VERSION)" >> .env
          echo "Created .env with APP_VERSION=$(cat VERSION)"
        if: success()
