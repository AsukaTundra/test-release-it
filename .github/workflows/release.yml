# Запускается при мердже PR в release: update_release_* → minor, update_hotfix_* → patch.
# Обновляет package.json, CHANGELOG.md, создаёт тег и записывает версию в VERSION и .env.

name: Release

on:
  pull_request:
    branches:
      - release
    types:
      - closed

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Только если PR смержен и заголовок — update_release_* или update_hotfix_*
    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.title, 'update_release_') || startsWith(github.event.pull_request.title, 'update_hotfix_'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release increment from PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ "$PR_TITLE" == update_release_* ]]; then
            echo "RELEASE_INCREMENT=minor" >> $GITHUB_ENV
          elif [[ "$PR_TITLE" == update_hotfix_* ]]; then
            echo "RELEASE_INCREMENT=patch" >> $GITHUB_ENV
          else
            echo "RELEASE_INCREMENT=patch" >> $GITHUB_ENV
          fi

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx release-it --ci --increment=$RELEASE_INCREMENT

      - name: Create .env with APP_VERSION
        run: |
          echo "APP_VERSION=$(cat VERSION)" >> .env
          echo "Created .env with APP_VERSION=$(cat VERSION)"
        if: success()
